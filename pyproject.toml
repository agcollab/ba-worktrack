[project]
name = "ba-worktrack"
version = "1.0.0"
description = "Task, time and requirements tracking for Business Analysts, with JIRA and Azure DevOps integration."
requires-python = ">=3.12"

[tool.ruff]
line-length = 135
target-version = "py312"
extend-exclude = [".venv", "Day3", "Day4", "api", "phase1-cli", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "B008",  # FastAPI's Depends() / Form() in defaults is the intended style
    "S101",  # assert is fine in tests
    "S311",  # random is only used for demo seed data and retry jitter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S105"]

[tool.coverage.run]
source = ["app"]
omit = ["app/scheduler.py"]

[tool.coverage.report]
skip_empty = true
