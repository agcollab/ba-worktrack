{% from "_macros.html" import status %}
<div id="task-status" class="d-flex flex-wrap align-items-center gap-2">
  {{ status(task.status) }}
  {% for s in next_statuses %}
  <form hx-post="/tasks/{{ task.id }}/status" hx-target="#task-status" hx-swap="outerHTML" class="m-0">
    <input type="hidden" name="status" value="{{ s.value }}">
    <button class="btn btn-sm {{ 'btn-primary' if loop.first else 'btn-ghost' }}">
      <i class="bi {{ 'bi-arrow-right' if loop.first else 'bi-arrow-return-left' }} me-1"></i>{{ s.value }}</button>
  </form>
  {% endfor %}
</div>
