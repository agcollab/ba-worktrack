# Alembic settings. Run alembic commands from the repository root.
[alembic]
# Folder that holds env.py and versions/
script_location = %(here)s/alembic
# Lets env.py do "from app..." imports
prepend_sys_path = .
path_separator = os
# Migration file names start with the date, e.g. 2026_10_19_1030-ab12cd34ef56_initial_tables.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# No sqlalchemy.url here on purpose: env.py reads DATABASE_URL from app/config.py (.env)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
